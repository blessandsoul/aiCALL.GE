<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset=".48" stop-color="#8b3dff"/>
      <stop offset="1" stop-color="#e040fb"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity=".25"/>
      <stop offset=".65" stop-color="#ff5a1f" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#111827" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="36" fill="#fbfcfc"/>
  <rect width="1200" height="630" rx="36" fill="url(#dots)"/>
  <rect width="1200" height="630" rx="36" fill="url(#glow)"/>
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="#fff" stroke="#e5e7eb"/>
  <text x="88" y="137" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-5">
    <tspan fill="url(#ai)" font-family="monospace">ai</tspan><tspan fill="#ff5a1f" letter-spacing="-3">CALL</tspan>
  </text>
  <rect x="88" y="180" width="150" height="34" rx="17" fill="#fff1eb"/>
  <circle cx="108" cy="197" r="5" fill="#ff5a1f"/>
  <text x="122" y="204" fill="#9a3412" font-family="Arial, sans-serif" font-size="15" font-weight="700">AI phone operator</text>
  <text x="88" y="310" fill="#111827" font-family="Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">
    <tspan x="88" dy="0">Calls answered.</tspan>
    <tspan x="88" dy="70">Bookings confirmed.</tspan>
  </text>
  <text x="88" y="494" fill="#4b5563" font-family="Arial, sans-serif" font-size="24">Georgian calls, clear outcomes, human handoff when needed.</text>
  <text x="88" y="548" fill="#6b7280" font-family="Arial, sans-serif" font-size="18">aicall.ge</text>
  <text x="1112" y="548" text-anchor="end" fill="#6b7280" font-family="Arial, sans-serif" font-size="18">by aiNOW</text>
